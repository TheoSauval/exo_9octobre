# Surcharge de montée de version : PostgreSQL 16 sur un nouveau volume.
# Retour arrière : docker compose -f compose.yml -f compose.pg16.yml down && docker compose -f compose.yml up -d db
services:
  db:
    image: postgres:16.4-alpine
    volumes: !override
      - pgdata16:/var/lib/postgresql/data
volumes:
  pgdata16:
