# Surcharge PROD : docker compose -f compose.yml -f compose.prod.yml up -d --wait
# Images tirées du registre (pas de build), durcissement, limites, réplicas.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  proxy:
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  api:
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit être défini}/shopapi:${VERSION:?VERSION doit être défini}
    <<: *hardening
    environment:
      LOG_LEVEL: info
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { memory: 64M }

  worker:
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit être défini}/shop-worker:${VERSION:?VERSION doit être défini}
    <<: *hardening
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  db:
    # pas de cap_drop ALL : l'entrypoint postgres a besoin de CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
